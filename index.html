<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ahmed Shaban - Flutter & Front-end Developer Portfolio</title>

  <!-- PERFORMANCE: resolve the theme before first paint. next-themes applies
       the `dark` class from an effect, which repainted the whole viewport (and
       re-rasterized the background) right after the first paint. -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem("theme");
        var systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        var dark = stored === "dark" || ((stored === null || stored === "system") && systemDark);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      } catch (e) { }
    })();
  </script>

  <!-- Preconnect + one render-blocking font stylesheet.
       PERFORMANCE: the previous `media="print" onload` swap started the
       @font-face request after `load`, so the font swap reflowed the hero <h1>
       in the middle of its entrance animation. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
  />
  <link
    rel="preload"
    as="image"
    href="/images/personal-image-640.webp"
    imagesrcset="/images/personal-image-320.webp 320w, /images/personal-image-640.webp 640w, /images/personal-image-960.webp 960w"
    imagesizes="(min-width: 1024px) 320px, (min-width: 768px) 288px, (min-width: 640px) 240px, 192px"
    type="image/webp"
    fetchpriority="high"
  />

  <meta name="description"
    content="Portfolio of Ahmed Shaban - Flutter Developer & Front-end Web Developer specializing in cross-platform mobile apps with Clean Architecture and modern React web applications." />
  <meta name="author" content="Ahmed Shaban" />

  <meta property="og:title" content="Ahmed Shaban - Flutter & Front-end Developer Portfolio" />
  <meta property="og:description"
    content="Fresh graduate specializing in Flutter mobile development and React web applications. Building clean, modern solutions with Firebase, Supabase, and payment integrations." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/og-image.jpg" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@ahmedshaban" />
  <meta name="twitter:image" content="/og-image.jpg" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
